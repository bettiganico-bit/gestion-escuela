<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Escolar - Secundaria</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <header class="bg-indigo-700 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">Panel de Gestión Escolar</h1>
      <button onclick="cargarDatos()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-3 py-1.5 rounded border border-indigo-400">
        🔄 Actualizar
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- Formulario para agregar nuevo alumno -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold mb-3 text-indigo-900">Registrar Nuevo Alumno</h2>
      <form id="registroForm" class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <input type="text" id="nombre" placeholder="Nombre completo del alumno" required class="p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <select id="pago" class="p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="PAGÓ">Pago: Al día</option>
          <option value="PENDIENTE">Pago: Pendiente</option>
        </select>
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium p-2 rounded-lg transition">
          + Guardar Registro
        </button>
      </form>
    </section>

    <!-- Tabla de datos desde Google Sheets -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-indigo-900">Listado de Planilla</h2>
        <span id="estadoCarga" class="text-xs text-slate-500">Cargando datos...</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr id="encabezadosTabla" class="border-b bg-slate-50 text-slate-600 text-xs uppercase tracking-wider">
              <!-- Se cargan dinámicamente -->
            </tr>
          </thead>
          <tbody id="cuerpoTabla" class="divide-y divide-slate-100 text-sm">
            <!-- Se cargan dinámicamente -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaDJPV3UglmOBx-6bpzJmgGhIKfVs1a-8zZmGtYb6Jxyq7b_c5xYPvqyX0Spydvnsm/exec";

    async function cargarDatos() {
      const estado = document.getElementById("estadoCarga");
      estado.innerText = "Sincronizando con Google Sheets...";
      try {
        const respuesta = await fetch(SCRIPT_URL);
        const datos = await respuesta.json();
        
        if (datos && datos.length > 0) {
          // Encabezados
          const trEncabezados = document.getElementById("encabezadosTabla");
          trEncabezados.innerHTML = "";
          datos[0].forEach(columna => {
            const th = document.createElement("th");
            th.className = "p-3 font-semibold";
            th.innerText = columna;
            trEncabezados.appendChild(th);
          });

          // Filas
          const cuerpo = document.getElementById("cuerpoTabla");
          cuerpo.innerHTML = "";
          datos.slice(1).forEach(fila => {
            const tr = document.createElement("tr");
            tr.className = "hover:bg-slate-50";
            fila.forEach(celda => {
              const td = document.createElement("td");
              td.className = "p-3";
              td.innerText = celda;
              tr.appendChild(td);
            });
            cuerpo.appendChild(tr);
          });
          estado.innerText = "Sincronizado ✅";
        }
      } catch (error) {
        console.error(error);
        estado.innerText = "Error al conectar con la planilla.";
      }
    }

    document.getElementById("registroForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nombre = document.getElementById("nombre").value;
      const pago = document.getElementById("pago").value;
      const estado = document.getElementById("estadoCarga");

      estado.innerText = "Guardando en Google Sheets...";

      // Envía datos a la planilla (se adaptan al orden de tus columnas)
      const nuevosDatos = [new Date().toLocaleDateString(), nombre, pago, "Presente"];

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ datos: nuevosDatos })
        });
        document.getElementById("nombre").value = "";
        cargarDatos();
      } catch (error) {
        console.error(error);
        estado.innerText = "Error al guardar.";
      }
    });

    // Cargar al iniciar
    cargarDatos();
  </script>
</body>
</html>
