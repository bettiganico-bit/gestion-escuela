<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Escuela - REMA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <div class="max-w-7xl mx-auto p-4 sm:p-6">
    
    <!-- Pestañas de Navegación -->
    <div class="flex border-b border-slate-300 mb-6 bg-white rounded-t-lg px-4 pt-2 shadow-sm">
      <button id="tab-rema7" onclick="cambiarTab('7')" class="py-3 px-6 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 focus:outline-none transition">
        REMA 7°
      </button>
      <button id="tab-rema1a4" onclick="cambiarTab('1a4')" class="py-3 px-6 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 focus:outline-none transition">
        REMA DE 1 A 4
      </button>
    </div>

    <!-- Panel de Estadísticas Dinámicas -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Alumnos</p>
        <p id="stat-total" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Pendientes de Pago</p>
        <p id="stat-pendientes" class="text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Turno Mañana</p>
        <p id="stat-tm" class="text-2xl font-bold text-indigo-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Turno Tarde</p>
        <p id="stat-tt" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
    </div>

    <!-- Filtros de Búsqueda -->
    <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-3">
      <div class="flex-1">
        <input type="text" id="filter-search" oninput="renderizarTabla()" placeholder="Buscar por alumno o código..." class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div class="w-full md:w-48">
        <select id="filter-curso" onchange="renderizarTabla()" class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="">Todos los Cursos</option>
        </select>
      </div>
      <div class="w-full md:w-48">
        <select id="filter-turno" onchange="renderizarTabla()" class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="">Todos los Turnos</option>
          <option value="TM">TM</option>
          <option value="TT">TT</option>
          <option value="Sin Asignar">Sin Asignar</option>
        </select>
      </div>
      <div class="w-full md:w-48">
        <select id="filter-estado" onchange="renderizarTabla()" class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="">Todos los Estados</option>
          <option value="Pendiente">Pendiente</option>
          <option value="Confirmado">Confirmado</option>
        </select>
      </div>
    </div>

    <!-- Tabla Principal -->
    <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
          <tr>
            <th class="py-3 px-4">Código</th>
            <th class="py-3 px-4">Alumno</th>
            <th class="py-3 px-4">Curso</th>
            <th class="py-3 px-4">Pago</th>
            <th class="py-3 px-4">Estado</th>
            <th class="py-3 px-4">Turno</th>
            <th class="py-3 px-4">Observaciones</th>
          </tr>
        </thead>
        <tbody id="tabla-body" class="divide-y divide-slate-100">
          <tr>
            <td colspan="7" class="py-8 text-center text-slate-400">Cargando datos...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // URL del Google Sheet publicado en formato CSV
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR.../pub?output=csv'; // Reemplazar con tu URL de CSV

    let todosLosAlumnos = [];
    let tabActual = '7';

    // Normalizador de texto para búsquedas sin acentos
    const normalizar = (txt) => (txt || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    function cargarDatos() {
      // Si usas CSV en directo de Google Sheets:
      Papa.parse(SHEET_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          procesarYLimpiarDatos(results.data);
        },
        error: function() {
          // Si no hay URL configurada se cargan datos de respaldo/ejemplo
          cargarDatosEjemplo();
        }
      });
    }

    function procesarYLimpiarDatos(data) {
      todosLosAlumnos = data
        .map((row) => {
          // Mapeo corregido según posición exacta de campos
          const codigo = (row['Código'] || row['codigo'] || '').toString().trim();
          const alumno = (row['Alumno'] || row['alumno'] || row['Nombre'] || '').toString().trim();
          const curso = (row['Curso'] || row['curso'] || '').toString().trim();
          const pago = (row['Pago'] || row['pago'] || 'NO').toString().trim().toUpperCase();
          const estado = (row['Estado'] || row['estado'] || 'Pendiente').toString().trim();
          const turno = (row['Turno'] || row['turno'] || 'Sin Asignar').toString().trim();
          const obs = (row['Observaciones'] || row['observaciones'] || '-').toString().trim();

          return { codigo, alumno, curso, pago, estado, turno, obs };
        })
        .filter((item) => {
          // FILTRO ANTI-DESFASAJE Y RESÚMENES:
          // Elimina filas donde "alumno" sea un número aislado (cantidades totales) o porcentajes (70%, 61%, etc.)
          const esNumeroSolo = /^\d+$/.test(item.alumno);
          const esPorcentaje = /^\d+(\.\d+)?%$/.test(item.alumno);
          const esAnoOFecha = /^(202[0-9]|viernes|lunes|martes|miércoles|jueves)/i.test(item.codigo);

          return item.alumno !== '' && !esNumeroSolo && !esPorcentaje && !esAnoOFecha;
        });

      actualizarFiltrosCurso();
      renderizarTabla();
    }

    function cargarDatosEjemplo() {
      // Datos de prueba limpios para verificación de estructura
      const rawMock = [
        { "Código": "701", "Alumno": "Álvarez, Mateo", "Curso": "7° A", "Pago": "NO", "Estado": "Pendiente", "Turno": "TM", "Observaciones": "-" },
        { "Código": "702", "Alumno": "Benítez, Sofia", "Curso": "7° B", "Pago": "SI", "Estado": "Confirmado", "Turno": "TT", "Observaciones": "-" },
        { "Código": "101", "Alumno": "Gómez, Lucas", "Curso": "1° A", "Pago": "NO", "Estado": "Pendiente", "Turno": "TM", "Observaciones": "-" },
        { "Código": "201", "Alumno": "López, Martina", "Curso": "2° B", "Pago": "SI", "Estado": "Confirmado", "Turno": "TT", "Observaciones": "-" },
        { "Código": "2023", "Alumno": "70%", "Curso": "3° A", "Pago": "NO", "Estado": "Pendiente", "Turno": "Sin Asignar", "Observaciones": "-" } // Fila basura que será descartada
      ];
      procesarYLimpiarDatos(rawMock);
    }

    function cambiarTab(tab) {
      tabActual = tab;
      
      const btn7 = document.getElementById('tab-rema7');
      const btn1a4 = document.getElementById('tab-rema1a4');

      if (tab === '7') {
        btn7.className = "py-3 px-6 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 focus:outline-none transition";
        btn1a4.className = "py-3 px-6 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 focus:outline-none transition";
      } else {
        btn1a4.className = "py-3 px-6 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 focus:outline-none transition";
        btn7.className = "py-3 px-6 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 focus:outline-none transition";
      }

      actualizarFiltrosCurso();
      renderizarTabla();
    }

    function obtenerAlumnosPestañaActual() {
      return todosLosAlumnos.filter((a) => {
        const c = a.curso.toLowerCase();
        if (tabActual === '7') {
          return c.includes('7');
        } else {
          return c.includes('1') || c.includes('2') || c.includes('3') || c.includes('4');
        }
      });
    }

    function actualizarFiltrosCurso() {
      const select = document.getElementById('filter-curso');
      const base = obtenerAlumnosPestañaActual();
      const cursosUnicos = [...new Set(base.map(a => a.curso))].sort();

      select.innerHTML = '<option value="">Todos los Cursos</option>';
      cursosUnicos.forEach(c => {
        if (c) select.innerHTML += `<option value="${c}">${c}</option>`;
      });
    }

    function renderizarTabla() {
      const search = normalizar(document.getElementById('filter-search').value);
      const curso = document.getElementById('filter-curso').value;
      const turno = document.getElementById('filter-turno').value;
      const estado = document.getElementById('filter-estado').value;

      const basePestaña = obtenerAlumnosPestañaActual();

      const filtrados = basePestaña.filter((a) => {
        const matchSearch = normalizar(a.alumno).includes(search) || normalizar(a.codigo).includes(search);
        const matchCurso = curso === '' || a.curso === curso;
        const matchTurno = turno === '' || a.turno === turno;
        const matchEstado = estado === '' || a.estado === estado;

        return matchSearch && matchCurso && matchTurno && matchEstado;
      });

      // Actualización del Panel Estadístico
      document.getElementById('stat-total').innerText = filtrados.length;
      document.getElementById('stat-pendientes').innerText = filtrados.filter(a => a.pago === 'NO' || a.estado === 'Pendiente').length;
      document.getElementById('stat-tm').innerText = filtrados.filter(a => a.turno === 'TM' || a.turno.toLowerCase().includes('mañana')).length;
      document.getElementById('stat-tt').innerText = filtrados.filter(a => a.turno === 'TT' || a.turno.toLowerCase().includes('tarde')).length;

      // Renderizado del Body
      const tbody = document.getElementById('tabla-body');
      tbody.innerHTML = '';

      if (filtrados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-400">No se encontraron registros.</td></tr>';
        return;
      }

      filtrados.forEach((a) => {
        const badgePago = a.pago === 'SI' 
          ? '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-800">SI</span>'
          : '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-rose-100 text-rose-800">NO</span>';

        const badgeEstado = a.estado === 'Confirmado'
          ? '<span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800">Confirmado</span>'
          : '<span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-amber-100 text-amber-800">Pendiente</span>';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3 px-4 font-mono text-xs text-slate-500">${a.codigo || '-'}</td>
            <td class="py-3 px-4 font-semibold text-slate-900">${a.alumno}</td>
            <td class="py-3 px-4">${a.curso}</td>
            <td class="py-3 px-4">${badgePago}</td>
            <td class="py-3 px-4">${badgeEstado}</td>
            <td class="py-3 px-4 text-slate-600">${a.turno}</td>
            <td class="py-3 px-4 text-slate-500 text-xs">${a.obs}</td>
          </tr>
        `;
      });
    }

    // Inicialización al cargar página
    window.onload = cargarDatos;
  </script>
</body>
</html>
